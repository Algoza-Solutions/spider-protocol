name: Verify SPIDER Bundle

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify specialist skill manifest (SHA-256)
        run: python skills/spider-orchestrator/scripts/verify_specialist_skills.py --codex-home .

      - name: Run bundle verifier unit tests
        run: python -m unittest discover -s skills/spider-orchestrator/scripts -v
